[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vikunja-agent-tools"
version = "0.1.0"
description = "Vikunja を中央タスク管理基盤として、複数の AI エージェントの作業状態を一元管理するためのツール群"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.scripts]
vikunja-mcp = "vikunja_agent_tools.mcp_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vikunja_agent_tools"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
